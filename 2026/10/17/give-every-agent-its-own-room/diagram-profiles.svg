<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" role="img" aria-labelledby="title desc">
  <title id="title">Two Koala VM profiles</title>
  <desc id="desc">Lean runs one OCI image with minimal init. Full runs a Linux distribution with systemd and Docker Engine inside the VM.</desc>
  <rect width="960" height="300" rx="22" fill="#f5f7fa"/>
  <rect x="32" y="28" width="434" height="244" rx="18" fill="#edf3fa" stroke="#c7d5e7" stroke-width="2"/>
  <rect x="496" y="28" width="432" height="244" rx="18" fill="#edf4ef" stroke="#c6d9cb" stroke-width="2"/>
  <rect x="56" y="50" width="84" height="25" rx="12" fill="#d6e3f2"/>
  <text x="72" y="67" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="700" letter-spacing="1" fill="#365275">LEAN</text>
  <text x="56" y="111" font-family="Inter,Arial,sans-serif" font-size="23" font-weight="700" fill="#253247">MicroVM</text>
  <text x="56" y="146" font-family="Inter,Arial,sans-serif" font-size="15" fill="#425169">One OCI image</text>
  <text x="56" y="170" font-family="Inter,Arial,sans-serif" font-size="15" fill="#425169">Minimal init</text>
  <text x="56" y="220" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="600" fill="#596579">For focused jobs and services</text>
  <rect x="520" y="50" width="84" height="25" rx="12" fill="#d8e9dc"/>
  <text x="536" y="67" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="700" letter-spacing="1" fill="#3f6c4b">FULL</text>
  <text x="520" y="111" font-family="Inter,Arial,sans-serif" font-size="23" font-weight="700" fill="#253247">Linux VM</text>
  <text x="520" y="146" font-family="Inter,Arial,sans-serif" font-size="15" fill="#425169">Linux distribution + systemd</text>
  <text x="520" y="170" font-family="Inter,Arial,sans-serif" font-size="15" fill="#425169">Docker Engine inside the guest</text>
  <text x="520" y="220" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="600" fill="#596579">For a fuller server environment</text>
  <text x="480" y="286" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="12" fill="#68758a">Both run on Koala’s verified Linux kernel · the OCI image supplies the filesystem</text>
</svg>
