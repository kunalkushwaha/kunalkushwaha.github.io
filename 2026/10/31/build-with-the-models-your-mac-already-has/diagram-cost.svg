<title id="t">Your process versus the system</title><desc id="d">Peak memory while working. Live captions: the app 24 MB, the speech service 262 MB. Translation: the benchmark 19 MB, translationd 345 MB. Summaries: the app 22 MB, the on-device inference service 370 MB. Work on the Neural Engine and GPU isn&#x27;t counted, so the system&#x27;s real cost is higher.</desc>
