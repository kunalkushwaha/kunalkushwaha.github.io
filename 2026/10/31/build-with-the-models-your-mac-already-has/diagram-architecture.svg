<text x="216.0" y="167.0" font-family="Inter,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#596579" text-anchor="middle">Core Audio process tap</text>
<rect x="58" y="198" width="316" height="58" rx="10" fill="#e8edf3" stroke="#b9c9dd" stroke-width="1.5"/>
<text x="216.0" y="223.0" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="650" fill="#253247" text-anchor="middle">Language arbiter</text>
<text x="216.0" y="241.0" font-family="Inter,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#596579" text-anchor="middle">Japanese or English?</text>
