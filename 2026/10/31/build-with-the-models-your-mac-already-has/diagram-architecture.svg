<rect width="960" height="500" rx="22" fill="#f5f7fa"/>
<text x="36" y="46" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="700" fill="#596579" text-anchor="start" letter-spacing="1.8">WHERE THE MODELS LIVE</text>
<rect x="36" y="66" width="360" height="400" rx="18" fill="#fff" stroke="#d4dce6" stroke-width="2"/>
