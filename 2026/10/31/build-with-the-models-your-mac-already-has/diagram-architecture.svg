<text x="216.0" y="371.0" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="650" fill="#253247" text-anchor="middle">Meeting folder</text>
<text x="216.0" y="389.0" font-family="Inter,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#596579" text-anchor="middle">transcript · summary.md</text>
<text x="58" y="438" font-family="Inter,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#596579" text-anchor="start">Glue code: speech 258 lines · translation 97 ·</text>
<text x="58" y="455" font-family="Inter,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#596579" text-anchor="start">summaries 337</text>
