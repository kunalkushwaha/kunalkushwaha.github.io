<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" role="img" aria-labelledby="t d">
<title id="t">Where the models live</title><desc id="d">Kikitori, a 2 MB app with no model, holds the audio capture, the language arbiter, the live panel and the meeting files. It sends audio to SpeechAnalyzer, captions to the Translation framework and transcript chunks to Foundation Models. Those run in macOS system services, with models the OS downloads, updates and shares with every app.</desc>
