<text x="216.0" y="297.0" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="650" fill="#253247" text-anchor="middle">Live panel</text>
<text x="216.0" y="315.0" font-family="Inter,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#596579" text-anchor="middle">newest line on top</text>
