<rect x="586" y="320" width="316" height="70" rx="10" fill="#fbe9e3" stroke="#c0441f" stroke-width="1.5"/>
<text x="744.0" y="351.0" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="650" fill="#253247" text-anchor="middle">Foundation Models</text>
<text x="744.0" y="369.0" font-family="Inter,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#596579" text-anchor="middle">on-device inference service</text>
<text x="586" y="425" font-family="Inter,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#596579" text-anchor="start">Models downloaded, updated and loaded by</text>
<text x="586" y="442" font-family="Inter,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#596579" text-anchor="start">the OS: speech ≈ 350 MB per language,</text>
<text x="586" y="459" font-family="Inter,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#596579" text-anchor="start">translation 60–110 MB per pair</text>
<line x1="400" y1="148" x2="578" y2="148" stroke="#c0441f" stroke-width="2" marker-end="url(#ar)"/>
