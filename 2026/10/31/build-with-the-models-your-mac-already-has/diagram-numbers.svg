<text x="36" y="424" font-family="Inter,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#596579" text-anchor="start">MacBook Pro M5 Pro, 48 GB, macOS 26.4.1 · synthetic speech (system voices) · medians of 3 runs on an idle Mac</text>
</svg>
