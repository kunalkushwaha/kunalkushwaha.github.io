<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" role="img" aria-labelledby="title desc">
<title id="title">One mistake, two designs</title><desc id="desc">Home, office, cloud and data center all draw from the same shared building blocks. With flat access, one compromised place reaches every other place. With a gate around each place, the same compromise stays where it started.</desc>
<defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1l7 4-7 4" fill="none" stroke="#c0441f" stroke-width="1.8" stroke-linecap="round"/></marker></defs>
<rect width="960" height="520" rx="22" fill="#f5f7fa"/>
<text x="36" y="48" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="700" fill="#596579" text-anchor="start" letter-spacing="1.8">SAME SHARED BLOCKS · ONE MISTAKE · TWO DESIGNS</text>
<rect x="36" y="72" width="436" height="314" rx="18" fill="#fff" stroke="#d4dce6" stroke-width="2"/><text x="58" y="104" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="700" fill="#253247" text-anchor="start" >Flat access</text><line x1="254" y1="236" x2="128" y2="150" stroke="#cbd4df" stroke-width="2" stroke-dasharray="3 5"/><line x1="254" y1="236" x2="380" y2="150" stroke="#cbd4df" stroke-width="2" stroke-dasharray="3 5"/><line x1="254" y1="236" x2="128" y2="322" stroke="#cbd4df" stroke-width="2" stroke-dasharray="3 5"/><line x1="254" y1="236" x2="380" y2="322" stroke="#cbd4df" stroke-width="2" stroke-dasharray="3 5"/><circle cx="254" cy="236" r="34" fill="#fff" stroke="#cbd4df" stroke-width="1.5"/><rect x="236" y="222" width="12" height="12" rx="2" fill="#6583ad"/><rect x="250" y="222" width="12" height="12" rx="2" fill="#8fa6c6"/><rect x="243" y="234" width="12" height="12" rx="2" fill="#d9b56a"/><rect x="257" y="234" width="12" height="12" rx="2" fill="#6583ad"/><text x="254" y="288" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="600" fill="#596579" text-anchor="middle" >shared blocks</text><rect x="68" y="131" width="120" height="38" rx="10" fill="#c0441f" stroke="#c0441f" stroke-width="1.5"/><text x="128" y="155" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="650" fill="#fff" text-anchor="middle" >Home</text><rect x="320" y="131" width="120" height="38" rx="10" fill="#f8e3da" stroke="#c0441f" stroke-width="1.5"/><text x="380" y="155" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="650" fill="#253247" text-anchor="middle" >Office</text><rect x="68" y="303" width="120" height="38" rx="10" fill="#f8e3da" stroke="#c0441f" stroke-width="1.5"/><text x="128" y="327" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="650" fill="#253247" text-anchor="middle" >Cloud</text><rect x="320" y="303" width="120" height="38" rx="10" fill="#f8e3da" stroke="#c0441f" stroke-width="1.5"/><text x="3