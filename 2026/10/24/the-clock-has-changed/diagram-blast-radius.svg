"292" width="148" height="60" rx="16" fill="none" stroke="#3f8a5f" stroke-width="2.5"/><rect x="649" y="311" width="10" height="22" rx="2" fill="#2f7f6f"/><rect x="520" y="303" width="120" height="38" rx="10" fill="#fff" stroke="#b9c9dd" stroke-width="1.5"/><text x="580" y="327" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="650" fill="#253247" text-anchor="middle" >Cloud</text><rect x="758" y="292" width="148" height="60" rx="16" fill="none" stroke="#3f8a5f" stroke-width="2.5"/><rect x="753" y="311" width="10" height="22" rx="2" fill="#2f7f6f"/><rect x="772" y="303" width="120" height="38" rx="10" fill="#fff" stroke="#b9c9dd" stroke-width="1.5"/><text x="832" y="327" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="650" fill="#253247" text-anchor="middle" >Data center</text><path d="M640 150 L646 150" stroke="#c0441f" stroke-width="2"/><path d="M646 141 L646 159" stroke="#c0441f" stroke-width="3" stroke-linecap="round"/><text x="706" y="372" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="650" fill="#2f6b48" text-anchor="middle" >The same mistake stays in one place</text>
<text x="36" y="422" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="700" fill="#596579" text-anchor="start" letter-spacing="1.4">WHAT A GATE IS MADE OF</text>
<rect x="36.0" y="438" width="168.0" height="48" rx="12" fill="#fff" stroke="#c6d9cb" stroke-width="1.5"/>
<text x="120.0" y="467" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="650" fill="#253247" text-anchor="middle" >Know what runs</text>
<rect x="216.0" y="438" width="168.0" height="48" rx="12" fill="#fff" stroke="#c6d9cb" stroke-width="1.5"/>
<text x="300.0" y="467" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="650" fill="#253247" text-anchor="middle" >Isolate</text>
<rect x="396.0" y="438" width="168.0" height="48" rx="12" fill="#fff" stroke="#c6d9cb" stroke-width="1.5"/>
<text x="480.0" y="467" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="650" fill="#253247" text-anchor="middle" >AI gateway + policy</text>
<rect x="576.0" y="438" width="168.0" height="48" rx="12" fill="#fff" stroke="#c6d9cb" stroke-width="1.5"/>
<text x="660.0" y="467" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="650" fill="#253247" text-anchor="middle" >Observe and stop</text>
