<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title id="t">Two kinds of sandbox</title><desc id="d">A coding sandbox is created, runs one task, has its diff reviewed by a human and is destroyed, so the next task starts clean. A long-running agent sandbox stays up for weeks, months, or years, reads untrusted email, web pages and messages, keeps memory and state, and reaches models, SaaS and payments through a gateway that holds the keys, applies policy, caps spend and keeps the record, with an observer that can stop it.</desc>
