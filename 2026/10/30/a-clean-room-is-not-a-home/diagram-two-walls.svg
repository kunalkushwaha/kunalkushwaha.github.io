<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title id="t">One wall or two</title><desc id="d">A typical coding sandbox puts one wall, a process sandbox or container, around the agent on the shared host kernel, next to your files and keys. Koala puts the agent in a VM with its own kernel, and the host processes that run the VM are sandboxed too, so an escape from the VM meets a second wall. Keys stay with the broker on the host.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1l7 4-7 4" fill="none" stroke="#596579" stroke-width="1.8" stroke-linecap="round"/></marker><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1l7 4-7 4" fill="none" stroke="#c0441f" stroke-width="1.8" stroke-linecap="round"/></marker></defs>
<rect width="960" height="470" rx="22" fill="#f5f7fa"/>
<text x="36" y="46" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="700" fill="#596579" text-anchor="start" letter-spacing="1.8">ONE WALL OR TWO</text>
<rect x="36" y="70" width="420" height="330" rx="18" fill="#fff" stroke="#d4dce6" stroke-width="2"/>
<text x="58" y="100" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="700" fill="#253247" text-anchor="start" >Typical coding sandbox</text>
<rect x="58" y="118" width="376" height="262" rx="12" fill="#f3f6fa" stroke="#b9c9dd" stroke-width="1.5"/>
<text x="76" y="144" font-family="Inter,Arial,sans-serif" font-size="13.5" font-weight="700" fill="#253247" text-anchor="start" >Your machine</text>
<text x="76" y="164" font-family="Inter,Arial,sans-serif" font-size="12.5" font-weight="500" fill="#596579" text-anchor="start" >shared host kernel · your files · your keys</text>
<rect x="96" y="188" width="300" height="150" rx="12" fill="#fff" stroke="#8fa6c6" stroke-width="2" stroke-dasharray="6 5"/>
<text x="116" y="212" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="700" fill="#6583ad" text-anchor="start" >Process sandbox or container</text>
<rect x="176" y="244" width="140" height="44" rx="10" fill="#fbeee8" stroke="#e6b9a8" stroke-width="1.5"/>
<text x="246" y="271" font-family="Inter,Arial,sans-serif" font-size="13.5" font-weight="700" fill="#8a4a35" text-anchor="middle" >agent</text>
<path d="M318 266 H440" stroke="#c0441f" stroke-width="2" stroke-dasharray="4 4" marker-end="url(#ar)"/>
<text x="246" y="314" font-family="Inter,Arial,sans-serif" font-size="12.5" font-weight="650" fill="#c0441f" text-anchor="middle" >one wall, shared kernel:</text>
<text x="246" y="330" font-family="Inter,Arial,sans-serif" font-size="12.5" font-weight="650" fill="#c0441f" text-anchor="middle" >a kernel bug is a way out</text>
<rect x="488" y="70" width="436" height="330" rx="18" fill="#edf4ef" stroke="#c6d9cb" stroke-width="2"/>
<text x="510" y="100" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="700" fill="#253247" text-anchor="start" >Koala</text>
<rect x="510" y="118" width="392" height="262" rx="12" fill="#f3f6fa" stroke="#b9c9dd" stroke-width="1.5"/>
<text x="528" y="144" font-family="Inter,Arial,sans-serif" font-size="13.5" font-weight="700" fill="#253247" text-anchor="start" >Host</text>
<rect x="770" y="128" width="118" height="40" rx="10" fill="#fff" stroke="#2f7f6f" stroke-width="2"/>
<text x="829" y="153" font-family="Inter,Arial,sans-serif" font-size="12.5" font-weight="700" fill="#2f7f6f" text-anchor="middle" >broker + keys</text>
<rect x="528" y="178" width="356" height="188" rx="12" fill="#fff" stroke="#2f7f6f" stroke-width="2.5"/>
<text x="546" y="200" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="700" fill="#2f7f6f" text-anchor="start" >Wall 2: sandboxed host processes</text>
<text x="546" y="218" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="500" fill="#596579" text-anchor="start" >hypervisor · shared folders · network · worker</text>
<rect x="560" y="232" width="292" height="118" rx="12" fill="#fff" stroke="#3f8a5f" stroke-width="2.5"/>
<text x="578" y="254" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="700" fill="#2f6b48" text-anchor="start" >Wall 1: VM with its own kernel</text>
<rect x="636" y="272" width="140" height="44" rx="10" fill="#fbeee8" stroke="#e6b9a8" stroke-width="1.5"/>
<text x="706" y="299" font-family="Inter,Arial,sans-serif" font-size="13.5" font-weight="700" fill="#8a4a35" text-anchor="middle" >agent</text>
<path d="M778 294 H842" fill="none" stroke="#c0441f" stroke-width="2"/>
<circle cx="852" cy="294" r="9" fill="#fff" stroke="#c0441f" stroke-width="2"/><path d="M848 290 L856 298 M856 290 L848 298" stroke="#c0441f" stroke-width="2"/>
<path d="M852 304 V340 H872" fill="none" stroke="#c0441f" stroke-width="2" stroke-dasharray="4 4"/>
<circle cx="882" cy="340" r="9" fill="#fff" stroke="#c0441f" stroke-width="2"/><path d="M878 336 L886 344 M886 336 L878 344" stroke="#c0441f" stroke-width="2"/>
<text x="706" y="338" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="650" fill="#c0441f" text-anchor="middle" >even past wall 1, wall 2</text>
<text x="36" y="436" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="600" fill="#253247" text-anchor="start" >A process sandbox is cheap and close to your machine: right for a task.</text>
<text x="36" y="458" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="600" fill="#253247" text-anchor="start" >A VM plus sandboxed host processes costs a few seconds: right for code you do not trust.</text>
</svg>