<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 380" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title id="t">Quiet failures</title><desc id="d">A drifting agent raises no errors. Requests or spend creep up day after day. A dashboard only reports it and the line keeps rising; a budget enforced outside the box stops it when it crosses the limit.</desc>
