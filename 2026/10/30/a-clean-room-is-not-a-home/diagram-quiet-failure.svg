<circle cx="690" cy="273" r="5" fill="#2f6b48"/>
<text x="704" y="278" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="700" fill="#253247" text-anchor="start" >Kill switch</text>
<text x="704" y="296" font-family="Inter,Arial,sans-serif" font-size="12.5" font-weight="500" fill="#596579" text-anchor="start" >outside the box</text>
