<text x="704" y="146" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="700" fill="#253247" text-anchor="start" >Logs</text>
<text x="704" y="164" font-family="Inter,Arial,sans-serif" font-size="12.5" font-weight="500" fill="#596579" text-anchor="start" >that outlive the agent</text>
