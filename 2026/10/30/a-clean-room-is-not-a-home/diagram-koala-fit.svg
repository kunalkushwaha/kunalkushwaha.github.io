<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title id="t">Where Koala fits</title><desc id="d">Koala covers three uses on the same boundary: throwaway VMs for strict test runs, long-running dev boxes for developers on shared servers, and long-running autonomous agents. Underneath all three: one VM per workload, keys on the host, every connection checked on the host, and recovery from crashes and upgrades.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1l7 4-7 4" fill="none" stroke="#596579" stroke-width="1.8" stroke-linecap="round"/></marker><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1l7 4-7 4" fill="none" stroke="#c0441f" stroke-width="1.8" stroke-linecap="round"/></marker></defs>
<rect width="960" height="470" rx="22" fill="#f5f7fa"/>
<text x="36" y="46" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="700" fill="#596579" text-anchor="start" letter-spacing="1.8">WHERE KOALA FITS</text>
<line x1="60" y1="96" x2="900" y2="96" stroke="#596579" stroke-width="2" marker-end="url(#a)"/>
<text x="60" y="82" font-family="Inter,Arial,sans-serif" font-size="12.5" font-weight="650" fill="#596579" text-anchor="start" >one run</text>
<text x="900" y="82" font-family="Inter,Arial,sans-serif" font-size="12.5" font-weight="650" fill="#596579" text-anchor="end" >months to years</text>
<text x="480" y="82" font-family="Inter,Arial,sans-serif" font-size="12.5" font-weight="700" fill="#253247" text-anchor="middle" >how long it lives</text>
<rect x="36" y="116" width="284" height="170" rx="14" fill="#fff" stroke="#b9c9dd" stroke-width="2"/>
<text x="56" y="148" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="700" fill="#253247" text-anchor="start" >Strict test runs</text>
<text x="56" y="170" font-family="Inter,Arial,sans-serif" font-size="12.5" font-weight="650" fill="#6583ad" text-anchor="start" >throwaway VM, about 5 s per run</text>
<text x="56" y="204" font-family="Inter,Arial,sans-serif" font-size="13.5" font-weight="500" fill="#596579" text-anchor="start" >koala run: boot, run, delete,</text>
<text x="56" y="226" font-family="Inter,Arial,sans-serif" font-size="13.5" font-weight="500" fill="#596579" text-anchor="start" >pass or fail. Tests that touch</text>
<text x="56" y="248" font-family="Inter,Arial,sans-serif" font-size="13.5" font-weight="500" fill="#596579" text-anchor="start" >the network or the system.</text>
<line x1="178" y1="288" x2="178" y2="318" stroke="#2f7f6f" stroke-width="2"/>
<rect x="338" y="116" width="284" height="170" rx="14" fill="#fff" stroke="#b9c9dd" stroke-width="2"/>
<text x="358" y="148" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="700" fill="#253247" text-anchor="start" >Developer dev boxes</text>
<text x="358" y="170" font-family="Inter,Arial,sans-serif" font-size="12.5" font-weight="650" fill="#6583ad" text-anchor="start" >long-running, per person, Linux</text>
<text x="358" y="204" font-family="Inter,Arial,sans-serif" font-size="13.5" font-weight="500" fill="#596579" text-anchor="start" >VMs keep running after logout.</text>
<text x="358" y="226" font-family="Inter,Arial,sans-serif" font-size="13.5" font-weight="500" fill="#596579" text-anchor="start" >Volumes outlive the VM.</text>
<text x="358" y="248" font-family="Inter,Arial,sans-serif" font-size="13.5" font-weight="500" fill="#596579" text-anchor="start" >Each user runs their own VMs.</text>
<line x1="480" y1="288" x2="480" y2="318" stroke="#2f7f6f" stroke-width="2"/>
<rect x="640" y="116" width="284" height="170" rx="14" fill="#edf4ef" stroke="#3f8a5f" stroke-width="2"/>
<text x="660" y="148" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="700" fill="#253247" text-anchor="start" >Autonomous agents</text>
<text x="660" y="170" font-family="Inter,Arial,sans-serif" font-size="12.5" font-weight="650" fill="#6583ad" text-anchor="start" >long-running, unattended</text>
<text x="660" y="204" font-family="Inter,Arial,sans-serif" font-size="13.5" font-weight="500" fill="#596579" text-anchor="start" >Keys never enter the VM.</text>
<text x="660" y="226" font-family="Inter,Arial,sans-serif" font-size="13.5" font-weight="500" fill="#596579" text-anchor="start" >The broker enforces policy</text>
<text x="660" y="248" font-family="Inter,Arial,sans-serif" font-size="13.5" font-weight="500" fill="#596579" text-anchor="start" >and rate limits per VM.</text>
<line x1="782" y1="288" x2="782" y2="318" stroke="#2f7f6f" stroke-width="2"/>
<rect x="36" y="320" width="888" height="118" rx="16" fill="#253247" stroke="#253247" stroke-width="1.5"/>
<text x="60" y="352" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="700" fill="#ffffff" text-anchor="start" >Same boundary underneath</text>
<text x="60" y="386" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="700" fill="#cfe3d6" text-anchor="start" >One VM</text>
<text x="60" y="406" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="500" fill="#c3cbd6" text-anchor="start" >per workload</text>
<text x="276" y="386" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="700" fill="#cfe3d6" text-anchor="start" >Keys stay</text>
<text x="276" y="406" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="500" fill="#c3cbd6" text-anchor="start" >on the host</text>
<text x="492" y="386" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="700" fill="#cfe3d6" text-anchor="start" >Every connection</text>
<text x="492" y="406" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="500" fill="#c3cbd6" text-anchor="start" >checked on the host</text>
<text x="708" y="386" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="700" fill="#cfe3d6" text-anchor="start" >Survives crashes</text>
<text x="708" y="406" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="500" fill="#c3cbd6" text-anchor="start" >and upgrades</text>
</svg>