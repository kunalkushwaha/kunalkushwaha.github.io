<line x1="500.0" y1="76" x2="500.0" y2="340" stroke="#e1e7ee"/>
<text x="550.0" y="72" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="600" fill="#596579" text-anchor="middle" >Day 4</text>
<line x1="600.0" y1="76" x2="600.0" y2="340" stroke="#e1e7ee"/>
<text x="650.0" y="72" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="600" fill="#596579" text-anchor="middle" >Day 5</text>
<line x1="700.0" y1="76" x2="700.0" y2="340" stroke="#e1e7ee"/>
<text x="750.0" y="72" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="600" fill="#596579" text-anchor="middle" >Day 6</text>
<line x1="800.0" y1="76" x2="800.0" y2="340" stroke="#e1e7ee"/>
<text x="850.0" y="72" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="600" fill="#596579" text-anchor="middle" >Day 7</text>
<line x1="900.0" y1="76" x2="900.0" y2="340" stroke="#e1e7ee"/>
<text x="36" y="124" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="700" fill="#253247" text-anchor="start" >Coding</text>
<text x="36" y="143" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="700" fill="#253247" text-anchor="start" >sandbox</text>
<rect x="206" y="104" width="85.0" height="44" rx="10" fill="#e8edf3" stroke="#b9c9dd" stroke-width="1.5"/>
<text x="230" y="131" font-family="Inter,Arial,sans-serif" font-size="12.5" font-weight="650" fill="#253247" text-anchor="start" >one task</text>
<circle cx="216" cy="126" r="7" fill="#c0441f"/>
<line x1="297.0" y1="126" x2="360.0" y2="126" stroke="#b9c9dd" stroke-width="2" stroke-dasharray="4 5"/>
<text x="370.0" y="131" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="650" fill="#6583ad" text-anchor="start" >destroyed: the input goes with it</text>
<text x="36" y="212" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="700" fill="#253247" text-anchor="start" >Long-running</text>
<text x="36" y="231" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="700" fill="#253247" text-anchor="start" >agent</text>
