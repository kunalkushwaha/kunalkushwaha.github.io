<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title id="t">Where a bad input goes</title><desc id="d">In a coding sandbox a poisoned input dies with the container. In a long-running agent it is written to memory on day one, read back on day four and acted on on day five, long after the input itself is gone.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1l7 4-7 4" fill="none" stroke="#596579" stroke-width="1.8" stroke-linecap="round"/></marker><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1l7 4-7 4" fill="none" stroke="#c0441f" stroke-width="1.8" stroke-linecap="round"/></marker></defs>
<rect width="960" height="430" rx="22" fill="#f5f7fa"/>
<text x="36" y="46" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="700" fill="#596579" text-anchor="start" letter-spacing="1.8">WHERE A BAD INPUT GOES</text>
<line x1="200.0" y1="76" x2="200.0" y2="340" stroke="#e1e7ee"/>
<text x="250.0" y="72" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="600" fill="#596579" text-anchor="middle" >Day 1</text>
