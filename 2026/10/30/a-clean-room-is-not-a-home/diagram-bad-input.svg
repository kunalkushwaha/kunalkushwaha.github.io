<path d="M240 236 C 240 262 240 262 240 286" fill="none" stroke="#c0441f" stroke-width="2" marker-end="url(#ar)"/>
<text x="250" y="266" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="650" fill="#c0441f" text-anchor="start" >written</text>
