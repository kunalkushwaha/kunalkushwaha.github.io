<rect x="646.0" y="199" width="118" height="26" rx="8" fill="#c0441f" stroke="#c0441f" stroke-width="1.5"/>
<text x="705.0" y="217" font-family="Inter,Arial,sans-serif" font-size="12.5" font-weight="700" fill="#fff" text-anchor="middle" >acts on it</text>
<line x1="36" y1="358" x2="924" y2="358" stroke="#d4dce6"/>
<text x="36" y="394" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="700" fill="#253247" text-anchor="start" >Treat memory like configuration:</text>
<rect x="290" y="374" width="172.4" height="32" rx="16" fill="#edf4ef" stroke="#c6d9cb" stroke-width="1.5"/>
<text x="376.2" y="395" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="650" fill="#2f6b48" text-anchor="middle" >know what is stored</text>
<rect x="472.4" y="374" width="88.8" height="32" rx="16" fill="#edf4ef" stroke="#c6d9cb" stroke-width="1.5"/>
<text x="516.8" y="395" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="650" fill="#2f6b48" text-anchor="middle" >snapshot</text>
<rect x="571.1999999999999" y="374" width="81.19999999999999" height="32" rx="16" fill="#edf4ef" stroke="#c6d9cb" stroke-width="1.5"/>
<text x="611.8" y="395" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="650" fill="#2f6b48" text-anchor="middle" >inspect</text>
<rect x="662.3999999999999" y="374" width="96.39999999999999" height="32" rx="16" fill="#edf4ef" stroke="#c6d9cb" stroke-width="1.5"/>
<text x="710.5999999999999" y="395" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="650" fill="#2f6b48" text-anchor="middle" >roll back</text>
</svg>