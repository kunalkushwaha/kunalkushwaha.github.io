<svg xmlns="http://www.w3.org/2000/svg" width="720" height="380" viewBox="0 0 720 380">
<defs>
<linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f4fbf8"/><stop offset="1" stop-color="#ddefe9"/></linearGradient>
<linearGradient id="water" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8fd0c7"/><stop offset="1" stop-color="#4da79d"/></linearGradient>
<radialGradient id="mglow" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#bfe9e2" stop-opacity="0.95"/><stop offset="0.5" stop-color="#6fbfb5" stop-opacity="0.4"/><stop offset="1" stop-color="#6fbfb5" stop-opacity="0"/></radialGradient>
<style>.sd{font-family:'Fraunces',Georgia,serif;}.mono{font-family:'SFMono-Regular',Menlo,Consolas,monospace;}</style>
<marker id="tg" markerWidth="9" markerHeight="9" refX="6" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 z" fill="#8aada7"/></marker>
</defs>
<rect x="0" y="0" width="720" height="380" rx="14" fill="url(#sky)"/>

<text x="44" y="46" class="mono" font-size="12" fill="#2f7d76" letter-spacing="4">ON BUILDING WITH AI</text>
<text x="676" y="46" text-anchor="end" class="sd" font-size="13" font-style="italic" fill="#5b8580">how you make a waterfall navigable</text>

<!-- the model: source of raw capability, lowest pool -->
<circle cx="75" cy="238" r="34" fill="url(#mglow)"/>
<circle cx="75" cy="238" r="11" fill="none" stroke="#2f7d76" stroke-width="1.8"/>
<circle cx="75" cy="238" r="3.5" fill="#2f7d76"/>

<!-- stepped water chambers, ascending toward shipped -->
<g>
  <rect x="40"  y="254" width="70"  height="42" fill="url(#water)"/>
  <rect x="110" y="226" width="110" height="70" fill="url(#water)"/>
  <rect x="220" y="198" width="110" height="98" fill="url(#water)"/>
  <rect x="330" y="170" width="110" height="126" fill="url(#water)"/>
  <rect x="440" y="142" width="110" height="154" fill="url(#water)"/>
  <rect x="550" y="114" width="130" height="182" fill="url(#water)"/>
</g>
<!-- water surface lines -->
<g stroke="#37968b" stroke-width="1.6">
  <line x1="40"  y1="254" x2="110" y2="254"/>
  <line x1="110" y1="226" x2="220" y2="226"/>
  <line x1="220" y1="198" x2="330" y2="198"/>
  <line x1="330" y1="170" x2="440" y2="170"/>
  <line x1="440" y1="142" x2="550" y2="142"/>
  <line x1="550" y1="114" x2="680" y2="114"/>
</g>

<!-- lock gates -->
<g fill="#16554f">
  <rect x="105" y="208" width="10" height="88" rx="2"/>
  <rect x="215" y="180" width="10" height="116" rx="2"/>
  <rect x="325" y="152" width="10" height="144" rx="2"/>
  <rect x="435" y="124" width="10" height="172" rx="2"/>
  <rect x="545" y="96"  width="10" height="200" rx="2"/>
</g>
<g fill="#0e3c38">
  <rect x="103" y="204" width="14" height="6" rx="2"/>
  <rect x="213" y="176" width="14" height="6" rx="2"/>
  <rect x="323" y="148" width="14" height="6" rx="2"/>
  <rect x="433" y="120" width="14" height="6" rx="2"/>
  <rect x="543" y="92"  width="14" height="6" rx="2"/>
</g>

<!-- boat climbing the locks -->
<g transform="translate(385,170)">
  <path d="M-26 0 L26 0 L16 12 L-16 12 Z" fill="#16554f"/>
  <line x1="0" y1="-2" x2="0" y2="-34" stroke="#16554f" stroke-width="2"/>
  <path d="M0 -34 L0 -6 L20 -6 Z" fill="#fffdf8" stroke="#2f7d76" stroke-width="1.2"/>
</g>

<!-- failures drain back -->
<path d="M470 132 C 452 112, 408 112, 392 128" fill="none" stroke="#8aada7" stroke-width="1.2" stroke-dasharray="3 5" marker-end="url(#tg)"/>
<text x="432" y="102" text-anchor="middle" class="mono" font-size="9.5" fill="#679b94">failures drain back a level</text>

<!-- shipped, at the top of the flight -->
<line x1="636" y1="114" x2="636" y2="66" stroke="#16554f" stroke-width="2"/>
<path d="M636 66 L672 76 L636 86 Z" fill="#2f7d76"/>
<text x="628" y="76" text-anchor="end" class="mono" font-size="11" fill="#16554f" letter-spacing="2">SHIPPED</text>

<!-- gate labels -->
<g class="mono" font-size="10" fill="#2f7d76" text-anchor="middle">
  <text x="110" y="312">design</text>
  <text x="220" y="312">implement</text>
  <text x="330" y="312">test</text>
  <text x="440" y="312">verify</text>
  <text x="550" y="312">review</text>
</g>
<text x="75" y="196" text-anchor="middle" class="mono" font-size="10" fill="#679b94">the model</text>
<text x="628" y="312" text-anchor="middle" class="mono" font-size="10" fill="#679b94">merge</text>

<!-- ground line -->
<line x1="40" y1="296" x2="680" y2="296" stroke="#37968b" stroke-width="1"/>

<!-- code footer -->
<line x1="0" y1="322" x2="720" y2="322" stroke="#cfe0db" stroke-width="1"/>
<g class="mono" font-size="10.5" fill="#6d8f8a">
  <text x="44" y="342">def ship(work):</text>
  <text x="70" y="357">for lock in canal:            # one gate per phase, one issue at a time</text>
  <text x="96" y="372">lock.raise_or_return(work)    # no gate, no passage</text>
</g>
<g class="mono" font-size="10.5" fill="#6d8f8a" text-anchor="end">
  <text x="690" y="342"># rapids: demos</text>
  <text x="690" y="357"># canal : shipped</text>
  <text x="690" y="372"># locks : the method</text>
</g>
</svg>
