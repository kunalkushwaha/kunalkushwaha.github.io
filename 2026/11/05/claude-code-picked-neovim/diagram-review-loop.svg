<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 376" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="880" height="376" rx="14" fill="#F8FAFC"/>
  <text x="40" y="52" font-size="22" font-weight="700" fill="#0F172A">What I couldn't give up</text>
  <text x="40" y="78" font-size="14" fill="#475569">Lighter editors were easy to find. Lighter editors that kept this were not.</text>
  <g font-size="14" font-weight="600" fill="#0F172A" text-anchor="middle">
    <text x="480" y="126">VS Code</text>
    <text x="480" y="144" font-size="12" font-weight="400" fill="#64748B">+ Claude Code extension</text>
    <text x="630" y="126">Helix</text>
    <text x="780" y="126">Neovim</text>
    <text x="780" y="144" font-size="12" font-weight="400" fill="#64748B">+ claudecode.nvim</text>
  </g>
  <g font-size="15" fill="#1E293B">
    <rect x="30" y="160" width="820" height="46" rx="8" fill="#FFFFFF" stroke="#E2E8F0"/>
    <text x="50" y="189">Changes show up as they land</text>
    <rect x="30" y="214" width="820" height="46" rx="8" fill="#FFFFFF" stroke="#E2E8F0"/>
    <text x="50" y="243">Diff review in the editor, when I want it</text>
    <rect x="30" y="268" width="820" height="46" rx="8" fill="#FFFFFF" stroke="#E2E8F0"/>
    <text x="50" y="297">File tree beside the code</text>
  </g>
  <g font-weight="600" text-anchor="middle">
    <g fill="#15803D" font-size="20"><text x="480" y="191">✓</text><text x="480" y="245">✓</text><text x="480" y="299">✓</text><text x="780" y="299">✓</text></g>
    <g fill="#C2410C" font-size="13" font-weight="500"><text x="630" y="189">manual reload</text><text x="630" y="243">terminal only</text><text x="630" y="297">no sidebar</text></g>
    <g fill="#15803D" font-size="13"><text x="780" y="189">✓  ~1 second</text><text x="780" y="243">✓  :w / :q</text></g>
  </g>
  <rect x="30" y="324" width="820" height="40" rx="8" fill="#0F172A"/>
  <text x="50" y="349" font-size="14" font-weight="600" fill="#F8FAFC">Editor memory per window</text>
  <text x="480" y="349" font-size="14" font-weight="700" fill="#FDBA74" text-anchor="middle">≈670 MB</text>
  <text x="630" y="349" font-size="13" fill="#94A3B8" text-anchor="middle">light</text>
  <text x="780" y="349" font-size="14" font-weight="700" fill="#86EFAC" text-anchor="middle">≈50–85 MB</text>
</svg>
