<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 380" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="880" height="380" rx="14" fill="#F8FAFC"/>
  <text x="40" y="52" font-size="22" font-weight="700" fill="#0F172A">Ten projects open: what actually shrank</text>
  <text x="40" y="78" font-size="14" fill="#475569">The editor got ~10× smaller. The total got ~2× smaller, because the heavy part never belonged to the editor.</text>

  <!-- scale: 6.7 GB editor = 400px -->
  <text x="40" y="140" font-size="15" font-weight="600" fill="#0F172A">VS Code</text>
  <rect x="140" y="118" width="400" height="38" rx="6" fill="#C2410C"/>
  <text x="340" y="142" font-size="14" font-weight="600" fill="#FFFFFF" text-anchor="middle">Editor ≈ 6.7 GB</text>
  <rect x="540" y="118" width="300" height="38" rx="6" fill="#CBD5E1"/>
  <text x="690" y="142" font-size="13" fill="#334155" text-anchor="middle">Claude Code + language servers</text>

  <text x="40" y="214" font-size="15" font-weight="600" fill="#0F172A">Neovim</text>
  <rect x="140" y="192" width="45" height="38" rx="6" fill="#15803D"/>
  <rect x="185" y="192" width="300" height="38" rx="6" fill="#CBD5E1"/>
  <text x="335" y="216" font-size="13" fill="#334155" text-anchor="middle">Claude Code + language servers</text>
  <text x="162" y="252" font-size="12" fill="#15803D" text-anchor="middle">&lt;1 GB</text>

  <!-- freed bracket -->
  <path d="M485 240 L485 252 L840 252 L840 240" fill="none" stroke="#0F172A" stroke-width="1.5"/>
  <text x="662" y="276" font-size="15" font-weight="700" fill="#0F172A" text-anchor="middle">≈ 6 GB back for local models, VMs, containers</text>

  <!-- footnotes -->
  <line x1="40" y1="306" x2="840" y2="306" stroke="#E2E8F0"/>
  <g font-size="13" fill="#475569">
    <text x="40" y="332">Grey part is identical in both editors (Claude Code ≈300–650 MB per session; gopls ≈1 GB per open Go project).</text>
    <text x="40" y="354">Grey bar drawn to match the ~half total drop measured; one snapshot on one Mac, not a benchmark.</text>
  </g>
</svg>
