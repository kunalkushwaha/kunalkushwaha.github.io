<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 420" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="880" height="420" rx="14" fill="#F8FAFC"/>
  <text x="40" y="52" font-size="22" font-weight="700" fill="#0F172A">One rule: the editor talks to no one</text>
  <text x="40" y="78" font-size="14" fill="#475569">A rule I could state in one line, and a test that checked it.</text>

  <!-- editor boundary -->
  <rect x="40" y="104" width="470" height="282" rx="12" fill="#FFFFFF" stroke="#0F172A" stroke-width="2"/>
  <text x="60" y="132" font-size="15" font-weight="700" fill="#0F172A">Neovim + plugins + 5 language servers</text>
  <g font-size="14" fill="#334155">
    <text x="60" y="166">Plugin auto-install</text>
    <text x="60" y="194">Update checks</text>
    <text x="60" y="222">Prebuilt binary download</text>
    <text x="60" y="250">JSON schema downloads</text>
    <text x="60" y="278">Remote images</text>
  </g>
  <g font-size="13" font-weight="600" fill="#C2410C">
    <text x="300" y="166">off</text><text x="300" y="194">off</text><text x="300" y="222">off</text><text x="300" y="250">off</text><text x="300" y="278">off</text>
  </g>
  <g stroke="#C2410C" stroke-width="2">
    <line x1="340" y1="161" x2="380" y2="161"/><line x1="340" y1="189" x2="380" y2="189"/><line x1="340" y1="217" x2="380" y2="217"/><line x1="340" y1="245" x2="380" y2="245"/><line x1="340" y1="273" x2="380" y2="273"/>
  </g>
  <g stroke="#C2410C" stroke-width="2.5">
    <line x1="388" y1="152" x2="404" y2="170"/><line x1="404" y1="152" x2="388" y2="170"/>
    <line x1="388" y1="180" x2="404" y2="198"/><line x1="404" y1="180" x2="388" y2="198"/>
    <line x1="388" y1="208" x2="404" y2="226"/><line x1="404" y1="208" x2="388" y2="226"/>
    <line x1="388" y1="236" x2="404" y2="254"/><line x1="404" y1="236" x2="388" y2="254"/>
    <line x1="388" y1="264" x2="404" y2="282"/><line x1="404" y1="264" x2="388" y2="282"/>
  </g>
  <rect x="60" y="300" width="430" height="66" rx="8" fill="#F0FDF4" stroke="#15803D"/>
  <text x="76" y="326" font-size="14" font-weight="700" fill="#15803D">Checked live: 0 network connections</text>
  <text x="76" y="350" font-size="13" fill="#166534">Updates only when I run them; versions pinned in a lockfile.</text>

  <!-- Claude Code -->
  <rect x="560" y="104" width="280" height="120" rx="12" fill="#FFFFFF" stroke="#94A3B8" stroke-width="2"/>
  <text x="580" y="134" font-size="15" font-weight="700" fill="#0F172A">Claude Code</text>
  <text x="580" y="160" font-size="13" fill="#475569">Talks to Anthropic. That's the job.</text>
  <text x="580" y="184" font-size="13" fill="#475569">Non-essential traffic: off.</text>
  <line x1="700" y1="224" x2="700" y2="290" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
  <defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#475569"/></marker></defs>
  <rect x="610" y="296" width="180" height="44" rx="8" fill="#E2E8F0"/>
  <text x="700" y="324" font-size="14" font-weight="600" fill="#0F172A" text-anchor="middle">Anthropic API</text>
</svg>
