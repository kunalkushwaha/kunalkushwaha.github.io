<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title id="t">Two steps, one way in</title><desc id="d">Step one, the way in: a guest VM sends packets with checksum offload hints, csum_start and csum_offset. The host kernel's IPv4 code takes those offsets on trust, which lets the guest read host memory 32 bytes at a time and, in the authors' lab, make small writes. Step two, the escape: they rewrite a Firecracker vCPU thread's saved registers, and because the VMM ran as root with no jailer and no seccomp, that means root on the host. It only works when guest packets enter the host kernel's network stack with the hints attached, through TAP, vhost-net or AF_PACKET.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1l7 4-7 4" fill="none" stroke="#596579" stroke-width="1.8" stroke-linecap="round"/></marker><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1l7 4-7 4" fill="none" stroke="#c0441f" stroke-width="1.8" stroke-linecap="round"/></marker><marker id="ag" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1l7 4-7 4" fill="none" stroke="#2f7f6f" stroke-width="1.8" stroke-linecap="round"/></marker></defs>
<rect width="960" height="420" rx="22" fill="#f5f7fa"/>
<text x="36" y="46" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="700" fill="#596579" text-anchor="start" letter-spacing="1.8">TWO STEPS, ONE WAY IN</text>
<path d="M36 104 H566" fill="none" stroke="#c0441f" stroke-width="2"/>
<text x="36" y="92" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="700" fill="#c0441f" text-anchor="start">Step 1: the way in</text>
<path d="M588 104 H934" fill="none" stroke="#253247" stroke-width="2"/>
<text x="588" y="92" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="700" fill="#253247" text-anchor="start">Step 2: the escape</text>
<rect x="36" y="124" width="162" height="166" rx="12" fill="#fbeee8" stroke="#e6b9a8" stroke-width="2"/>
<text x="117" y="154" font-family="Inter,Arial,sans-serif" font-size="14.5" font-weight="700" fill="#8a4a35" text-anchor="middle">Guest VM</text>
<text x="117" y="184" font-family="Inter,Arial,sans-serif" font-size="12.5" font-weight="500" fill="#596579" text-anchor="middle">sends a packet</text>
<text x="117" y="203" font-family="Inter,Arial,sans-serif" font-size="12.5" font-weight="500" fill="#596579" text-anchor="middle">with offload hints:</text>
<text x="117" y="224" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="12.5" font-weight="600" fill="#c0441f" text-anchor="middle">csum_start</text>
<text x="117" y="243" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="12.5" font-weight="600" fill="#c0441f" text-anchor="middle">csum_offset</text>
<path d="M200 207 H216" fill="none" stroke="#c0441f" stroke-width="2" marker-end="url(#ar)"/>
<rect x="220" y="124" width="162" height="166" rx="12" fill="#fff" stroke="#c0441f" stroke-width="2"/>
<text x="301" y="154" font-family="Inter,Arial,sans-serif" font-size="14.5" font-weight="700" fill="#c0441f" text-anchor="middle">Host kernel</text>
<text x="301" y="184" font-family="Inter,Arial,sans-serif" font-size="12.5" font-weight="500" fill="#596579" text-anchor="middle">IPv4 code takes</text>
<text x="301" y="203" font-family="Inter,Arial,sans-serif" font-size="12.5" font-weight="500" fill="#596579" text-anchor="middle">the guest's offsets</text>
<text x="301" y="222" font-family="Inter,Arial,sans-serif" font-size="12.5" font-weight="500" fill="#596579" text-anchor="middle">on trust</text>
<path d="M384 207 H400" fill="none" stroke="#c0441f" stroke-width="2" marker-end="url(#ar)"/>
<rect x="404" y="124" width="162" height="166" rx="12" fill="#fff" stroke="#d4dce6" stroke-width="2"/>
<text x="485" y="154" font-family="Inter,Arial,sans-serif" font-size="14.5" font-weight="700" fill="#253247" text-anchor="middle">Host memory</text>
<text x="485" y="184" font-family="Inter,Arial,sans-serif" font-size="12.5" font-weight="500" fill="#596579" text-anchor="middle">read 32 bytes</text>
<text x="485" y="203" font-family="Inter,Arial,sans-serif" font-size="12.5" font-weight="500" fill="#596579" text-anchor="middle">at a time; small</text>
<text x="485" y="222" font-family="Inter,Arial,sans-serif" font-size="12.5" font-weight="500" fill="#596579" text-anchor="middle">writes in the</text>
<text x="485" y="241" font-family="Inter,Arial,sans-serif" font-size="12.5" font-weight="500" fill="#596579" text-anchor="middle">authors' lab</text>
<path d="M568 207 H584" fill="none" stroke="#596579" stroke-width="2" marker-end="url(#a)"/>
<rect x="588" y="124" width="162" height="166" rx="12" fill="#fff" stroke="#d4dce6" stroke-width="2"/>
<text x="669" y="154" font-family="Inter,Arial,sans-serif" font-size="14.5" font-weight="700" fill="#253247" text-anchor="middle">Firecracker</text>
<text x="669" y="184" font-family="Inter,Arial,sans-serif" font-size="12.5" font-weight="500" fill="#596579" text-anchor="middle">a vCPU thread's</text>
<text x="669" y="203" font-family="Inter,Arial,sans-serif" font-size="12.5" font-weight="500" fill="#596579" text-anchor="middle">saved registers</text>
<text x="669" y="222" font-family="Inter,Arial,sans-serif" font-size="12.5" font-weight="500" fill="#596579" text-anchor="middle">rewritten</text>
<path d="M752 207 H768" fill="none" stroke="#596579" stroke-width="2" marker-end="url(#a)"/>
<rect x="772" y="124" width="162" height="166" rx="12" fill="#fff" stroke="#d4dce6" stroke-width="2"/>
<text x="853" y="154" font-family="Inter,Arial,sans-serif" font-size="14.5" font-weight="700" fill="#253247" text-anchor="middle">Root on the host</text>
<text x="853" y="184" font-family="Inter,Arial,sans-serif" font-size="12.5" font-weight="500" fill="#596579" text-anchor="middle">VMM ran as root</text>
<text x="853" y="203" font-family="Inter,Arial,sans-serif" font-size="12.5" font-weight="500" fill="#596579" text-anchor="middle">no jailer</text>
<text x="853" y="222" font-family="Inter,Arial,sans-serif" font-size="12.5" font-weight="500" fill="#596579" text-anchor="middle">no seccomp</text>
<rect x="36" y="318" width="898" height="74" rx="14" fill="#fff" stroke="#d4dce6" stroke-width="2"/>
<text x="58" y="348" font-family="Inter,Arial,sans-serif" font-size="13.5" font-weight="600" fill="#253247" text-anchor="start">It only works when guest packets enter the host kernel's network stack with the hints attached:</text>
<text x="58" y="372" font-family="Inter,Arial,sans-serif" font-size="13.5" font-weight="500" fill="#596579" text-anchor="start">TAP device, vhost-net, or AF_PACKET. The common fast paths.</text>
</svg>
