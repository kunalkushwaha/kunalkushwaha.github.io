<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 530" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title id="t">Where guest packets get parsed</title><desc id="d">In the usual fast path, the guest VM sends a frame with offload hints through a TAP device or vhost-net, and the host kernel network stack parses the guest's frame and trusts its hints. In Koala, the guest sends complete, checksummed frames over vhost-user queues handed over by Cloud Hypervisor to koala-net, a process that runs as you with gVisor's netstack in userspace. When policy allows a connection, koala-net opens an ordinary socket and the host kernel builds its own packets. The kernel only sees koala-net's own sockets.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1l7 4-7 4" fill="none" stroke="#596579" stroke-width="1.8" stroke-linecap="round"/></marker><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1l7 4-7 4" fill="none" stroke="#c0441f" stroke-width="1.8" stroke-linecap="round"/></marker><marker id="ag" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1l7 4-7 4" fill="none" stroke="#2f7f6f" stroke-width="1.8" stroke-linecap="round"/></marker></defs>
<rect width="960" height="530" rx="22" fill="#f5f7fa"/>
<text x="36" y="46" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="700" fill="#596579" text-anchor="start" letter-spacing="1.8">WHERE GUEST PACKETS GET PARSED</text>
<rect x="36" y="70" width="420" height="430" rx="18" fill="#fff" stroke="#d4dce6" stroke-width="2"/>
<text x="58" y="100" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="700" fill="#253247" text-anchor="start">The usual fast path</text>
<rect x="488" y="70" width="436" height="430" rx="18" fill="#edf4ef" stroke="#c6d9cb" stroke-width="2"/>
<text x="510" y="100" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="700" fill="#253247" text-anchor="start">Koala</text>
<rect x="96" y="122" width="300" height="58" rx="12" fill="#fbeee8" stroke="#e6b9a8" stroke-width="2"/>
<text x="246" y="146" font-family="Inter,Arial,sans-serif" font-size="13.5" font-weight="700" fill="#8a4a35" text-anchor="middle">Guest VM</text>
<text x="246" y="165" font-family="Inter,Arial,sans-serif" font-size="12.5" font-weight="500" fill="#596579" text-anchor="middle">frame + offload hints</text>
<rect x="96" y="214" width="300" height="44" rx="12" fill="#fff" stroke="#8fa6c6" stroke-width="2" stroke-dasharray="6 5"/>
<text x="246" y="241.0" font-family="Inter,Arial,sans-serif" font-size="13.5" font-weight="700" fill="#6583ad" text-anchor="middle">TAP device / vhost-net</text>
<rect x="96" y="292" width="300" height="76" rx="12" fill="#fff" stroke="#c0441f" stroke-width="2.5"/>
<text x="246" y="316" font-family="Inter,Arial,sans-serif" font-size="13.5" font-weight="700" fill="#c0441f" text-anchor="middle">Host kernel network stack</text>
<text x="246" y="335" font-family="Inter,Arial,sans-serif" font-size="12.5" font-weight="500" fill="#596579" text-anchor="middle">parses the guest's frame</text>
<text x="246" y="354" font-family="Inter,Arial,sans-serif" font-size="12.5" font-weight="500" fill="#596579" text-anchor="middle">and trusts its hints</text>
<rect x="96" y="402" width="300" height="44" rx="12" fill="#fff" stroke="#d4dce6" stroke-width="2"/>
<text x="246" y="429.0" font-family="Inter,Arial,sans-serif" font-size="13.5" font-weight="700" fill="#253247" text-anchor="middle">network</text>
<path d="M246 182 V210" fill="none" stroke="#c0441f" stroke-width="2" marker-end="url(#ar)"/>
<path d="M246 260 V288" fill="none" stroke="#c0441f" stroke-width="2" marker-end="url(#ar)"/>
<path d="M246 370 V398" fill="none" stroke="#596579" stroke-width="2" marker-end="url(#a)"/>
<text x="246" y="478" font-family="Inter,Arial,sans-serif" font-size="12.5" font-weight="650" fill="#c0441f" text-anchor="middle">Bytes the guest wrote run through kernel code</text>
<rect x="556" y="122" width="300" height="58" rx="12" fill="#fbeee8" stroke="#e6b9a8" stroke-width="2"/>
<text x="706" y="146" font-family="Inter,Arial,sans-serif" font-size="13.5" font-weight="700" fill="#8a4a35" text-anchor="middle">Guest VM</text>
<text x="706" y="165" font-family="Inter,Arial,sans-serif" font-size="12.5" font-weight="500" fill="#596579" text-anchor="middle">complete, checksummed frames</text>
<rect x="556" y="214" width="300" height="58" rx="12" fill="#fff" stroke="#b9c9dd" stroke-width="2"/>
<text x="706" y="238" font-family="Inter,Arial,sans-serif" font-size="13.5" font-weight="700" fill="#253247" text-anchor="middle">vhost-user queues</text>
<text x="706" y="257" font-family="Inter,Arial,sans-serif" font-size="12.5" font-weight="500" fill="#596579" text-anchor="middle">handed over by Cloud Hypervisor</text>
<rect x="556" y="306" width="300" height="76" rx="12" fill="#fff" stroke="#2f7f6f" stroke-width="2.5"/>
<text x="706" y="330" font-family="Inter,Arial,sans-serif" font-size="13.5" font-weight="700" fill="#2f7f6f" text-anchor="middle">koala-net  (runs as you)</text>
<text x="706" y="349" font-family="Inter,Arial,sans-serif" font-size="12.5" font-weight="500" fill="#596579" text-anchor="middle">gVisor netstack in userspace</text>
<text x="706" y="368" font-family="Inter,Arial,sans-serif" font-size="12.5" font-weight="500" fill="#596579" text-anchor="middle">policy decides what may leave</text>
<rect x="556" y="420" width="300" height="44" rx="12" fill="#fff" stroke="#d4dce6" stroke-width="2"/>
<text x="706" y="447.0" font-family="Inter,Arial,sans-serif" font-size="13.5" font-weight="700" fill="#253247" text-anchor="middle">host kernel builds its own packets</text>
<path d="M706 182 V210" fill="none" stroke="#596579" stroke-width="2" marker-end="url(#a)"/>
<path d="M706 274 V302" fill="none" stroke="#596579" stroke-width="2" marker-end="url(#a)"/>
<path d="M706 384 V416" fill="none" stroke="#2f7f6f" stroke-width="2" marker-end="url(#ag)"/>
<text x="718" y="404.0" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="600" fill="#2f7f6f" text-anchor="start">ordinary socket</text>
<text x="706" y="488" font-family="Inter,Arial,sans-serif" font-size="12.5" font-weight="650" fill="#2f7f6f" text-anchor="middle">The kernel only sees koala-net's own sockets</text>
</svg>
