<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" width="1200" height="620" role="img" aria-label="Four egress profiles arranged by blast radius, with the default deliberately not the tightest.">
  <rect width="1200" height="620" fill="#FAF6EF"/>

  <text x="60" y="46" font-family="Helvetica Neue, Arial, sans-serif" font-size="14" letter-spacing="4" fill="#7A6E60">BLAST RADIUS</text>

  <!-- scale bar -->
  <rect x="60" y="66" width="1080" height="8" rx="4" fill="#F1E9DC"/>
  <rect x="60" y="66" width="1080" height="8" rx="4" fill="url(#g)"/>
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#C8922A" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#C0441F" stop-opacity="0.85"/>
    </linearGradient>
  </defs>

  <!-- four profiles -->
  <g>
    <rect x="60" y="106" width="252" height="220" rx="8" fill="#F1E9DC" stroke="#2A2622" stroke-width="2.5"/>
    <text x="84" y="150" font-family="Iowan Old Style, Palatino, Georgia, serif" font-size="26" fill="#2A2622">sealed</text>
    <line x1="84" y1="168" x2="288" y2="168" stroke="#DDD1BF" stroke-width="2"/>
    <text x="84" y="200" font-family="Helvetica Neue, Arial, sans-serif" font-size="16" fill="#7A6E60">the model bridge,</text>
    <text x="84" y="224" font-family="Helvetica Neue, Arial, sans-serif" font-size="16" fill="#7A6E60">and nothing else</text>
    <text x="84" y="272" font-family="Helvetica Neue, Arial, sans-serif" font-size="15" fill="#C0441F">untrusted input</text>
    <text x="84" y="296" font-family="Helvetica Neue, Arial, sans-serif" font-size="15" fill="#C0441F">forced for throwaway tasks</text>
  </g>

  <g>
    <rect x="336" y="106" width="252" height="220" rx="8" fill="#F1E9DC" stroke="#C0441F" stroke-width="3.5"/>
    <text x="360" y="150" font-family="Iowan Old Style, Palatino, Georgia, serif" font-size="26" fill="#2A2622">research</text>
    <line x1="360" y1="168" x2="564" y2="168" stroke="#DDD1BF" stroke-width="2"/>
    <text x="360" y="200" font-family="Helvetica Neue, Arial, sans-serif" font-size="16" fill="#7A6E60">search, Wikipedia,</text>
    <text x="360" y="224" font-family="Helvetica Neue, Arial, sans-serif" font-size="16" fill="#7A6E60">arXiv, Crossref, HN</text>
    <text x="360" y="272" font-family="Helvetica Neue, Arial, sans-serif" font-size="15" fill="#7A6E60">reading and writing</text>
    <rect x="360" y="284" width="94" height="30" rx="15" fill="#C0441F"/>
    <text x="407" y="305" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="15" fill="#FAF6EF">default</text>
  </g>

  <g>
    <rect x="612" y="106" width="252" height="220" rx="8" fill="#F1E9DC" stroke="#2A2622" stroke-width="2.5"/>
    <text x="636" y="150" font-family="Iowan Old Style, Palatino, Georgia, serif" font-size="26" fill="#2A2622">dev</text>
    <line x1="636" y1="168" x2="840" y2="168" stroke="#DDD1BF" stroke-width="2"/>
    <text x="636" y="200" font-family="Helvetica Neue, Arial, sans-serif" font-size="16" fill="#7A6E60">research plus PyPI,</text>
    <text x="636" y="224" font-family="Helvetica Neue, Arial, sans-serif" font-size="16" fill="#7A6E60">npm, crates, Go, GitHub</text>
    <text x="636" y="272" font-family="Helvetica Neue, Arial, sans-serif" font-size="15" fill="#7A6E60">coding agents</text>
  </g>

  <g>
    <rect x="888" y="106" width="252" height="220" rx="8" fill="#F1E9DC" stroke="#2A2622" stroke-width="2.5"/>
    <text x="912" y="150" font-family="Iowan Old Style, Palatino, Georgia, serif" font-size="26" fill="#2A2622">open</text>
    <line x1="912" y1="168" x2="1116" y2="168" stroke="#DDD1BF" stroke-width="2"/>
    <text x="912" y="200" font-family="Helvetica Neue, Arial, sans-serif" font-size="16" fill="#7A6E60">everything</text>
    <text x="912" y="272" font-family="Helvetica Neue, Arial, sans-serif" font-size="15" fill="#7A6E60">you have decided</text>
  </g>

  <text x="60" y="368" font-family="Helvetica Neue, Arial, sans-serif" font-size="16" fill="#7A6E60">A profile is a starting point, never a ceiling. Your own allowlist layers on top of whichever one is active.</text>

  <!-- bounded escapes -->
  <line x1="60" y1="404" x2="1140" y2="404" stroke="#DDD1BF" stroke-width="2"/>
  <text x="60" y="446" font-family="Iowan Old Style, Palatino, Georgia, serif" font-size="23" fill="#2A2622">Two bounded escapes, for what an allowlist cannot express</text>

  <rect x="60" y="470" width="520" height="112" rx="6" fill="#F1E9DC" stroke="#2A2622" stroke-width="2.5"/>
  <text x="84" y="506" font-family="Iowan Old Style, Palatino, Georgia, serif" font-size="21" fill="#2A2622">Window</text>
  <text x="84" y="534" font-family="Helvetica Neue, Arial, sans-serif" font-size="16" fill="#7A6E60">you are at a keyboard: opens for the run,</text>
  <text x="84" y="558" font-family="Helvetica Neue, Arial, sans-serif" font-size="16" fill="#7A6E60">reseals afterwards, even on interrupt</text>

  <rect x="620" y="470" width="520" height="112" rx="6" fill="#F1E9DC" stroke="#C8922A" stroke-width="2.5"/>
  <text x="644" y="506" font-family="Iowan Old Style, Palatino, Georgia, serif" font-size="21" fill="#2A2622">Approved window</text>
  <text x="644" y="534" font-family="Helvetica Neue, Arial, sans-serif" font-size="16" fill="#7A6E60">you are on your phone: the sandbox asks,</text>
  <text x="644" y="558" font-family="Helvetica Neue, Arial, sans-serif" font-size="16" fill="#7A6E60">you tap approve, the kernel times it out</text>
</svg>
