<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760" role="img" aria-label="What crosses the boundary between host and sandbox, which model backends the bridge fronts, and what never crosses.">
  <rect width="1200" height="760" fill="#FAF6EF"/>

  <text x="60" y="46" font-family="Helvetica Neue, Arial, sans-serif" font-size="14" letter-spacing="5" fill="#7A6E60">MY SIDE</text>
  <text x="1140" y="46" text-anchor="end" font-family="Helvetica Neue, Arial, sans-serif" font-size="14" letter-spacing="5" fill="#7A6E60">THE AGENT&#39;S SIDE</text>

  <defs>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 z" fill="#2A2622"/></marker>
    <marker id="arg" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 z" fill="#C8922A"/></marker>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 z" fill="#C0441F"/></marker>
  </defs>

  <!-- the wall -->
  <rect x="700" y="64" width="16" height="452" rx="8" fill="#2A2622"/>

  <!-- bridge (host) -->
  <rect x="392" y="76" width="220" height="128" rx="6" fill="#F1E9DC" stroke="#2A2622" stroke-width="2.5"/>
  <text x="414" y="112" font-family="Iowan Old Style, Palatino, Georgia, serif" font-size="21" fill="#2A2622">Bridge</text>
  <text x="414" y="138" font-family="Helvetica Neue, Arial, sans-serif" font-size="14" fill="#7A6E60">runs as me, injects the key</text>
  <text x="414" y="162" font-family="Helvetica Neue, Arial, sans-serif" font-size="14" fill="#7A6E60">logs every call</text>
  <text x="414" y="188" font-family="Helvetica Neue, Arial, sans-serif" font-size="14" fill="#C0441F">enforces the spend cap</text>

  <!-- backends behind the bridge -->
  <g font-family="Helvetica Neue, Arial, sans-serif" font-size="14">
    <rect x="60" y="60" width="250" height="42" rx="8" fill="#FDFBF7" stroke="#2A2622" stroke-width="2"/>
    <text x="78" y="87" fill="#2A2622">ollama, local, no credential</text>
    <rect x="60" y="112" width="250" height="42" rx="8" fill="#FDFBF7" stroke="#C0441F" stroke-width="2"/>
    <text x="78" y="139" fill="#2A2622">gemini / anthropic / openrouter</text>
    <rect x="60" y="164" width="250" height="42" rx="8" fill="#FDFBF7" stroke="#C0441F" stroke-width="2"/>
    <text x="78" y="191" fill="#2A2622">any OpenAI compatible API</text>
    <rect x="60" y="216" width="250" height="42" rx="8" fill="#FDFBF7" stroke="#2A2622" stroke-width="2"/>
    <text x="78" y="243" fill="#2A2622">host claude, existing auth</text>
  </g>
  <path d="M310 81 H352 V140" fill="none" stroke="#7A6E60" stroke-width="2"/>
  <path d="M310 133 H352" fill="none" stroke="#7A6E60" stroke-width="2"/>
  <path d="M310 185 H352" fill="none" stroke="#7A6E60" stroke-width="2"/>
  <path d="M310 237 H352 V140" fill="none" stroke="#7A6E60" stroke-width="2"/>
  <line x1="352" y1="140" x2="386" y2="140" stroke="#7A6E60" stroke-width="2" marker-end="url(#ar)"/>
  <text x="60" y="286" font-family="Helvetica Neue, Arial, sans-serif" font-size="14" fill="#7A6E60">one command switches between them</text>
  <text x="60" y="306" font-family="Helvetica Neue, Arial, sans-serif" font-size="14" fill="#7A6E60">and the agent cannot tell which</text>

  <!-- host controls -->
  <rect x="392" y="238" width="220" height="66" rx="6" fill="#F1E9DC" stroke="#C0441F" stroke-width="2.5"/>
  <text x="414" y="272" font-family="Iowan Old Style, Palatino, Georgia, serif" font-size="21" fill="#2A2622">Egress rule</text>
  <text x="414" y="294" font-family="Helvetica Neue, Arial, sans-serif" font-size="14" fill="#C0441F">on the host interface</text>

  <rect x="392" y="330" width="220" height="66" rx="6" fill="#F1E9DC" stroke="#2A2622" stroke-width="2.5"/>
  <text x="414" y="364" font-family="Iowan Old Style, Palatino, Georgia, serif" font-size="21" fill="#2A2622">Warden</text>
  <text x="414" y="386" font-family="Helvetica Neue, Arial, sans-serif" font-size="14" fill="#7A6E60">grants windows, root only</text>

  <rect x="392" y="422" width="220" height="66" rx="6" fill="#F1E9DC" stroke="#2A2622" stroke-width="2.5"/>
  <text x="414" y="456" font-family="Iowan Old Style, Palatino, Georgia, serif" font-size="21" fill="#2A2622">Memory store</text>
  <text x="414" y="478" font-family="Helvetica Neue, Arial, sans-serif" font-size="14" fill="#7A6E60">every ten minutes, to my disk</text>

  <!-- sandbox boxes -->
  <rect x="912" y="76" width="228" height="66" rx="6" fill="#F1E9DC" stroke="#2A2622" stroke-width="2.5"/>
  <text x="934" y="110" font-family="Iowan Old Style, Palatino, Georgia, serif" font-size="21" fill="#2A2622">Hermes agent</text>
  <text x="934" y="132" font-family="Helvetica Neue, Arial, sans-serif" font-size="15" fill="#7A6E60">root, and welcome to it</text>

  <rect x="912" y="168" width="228" height="66" rx="6" fill="#F1E9DC" stroke="#2A2622" stroke-width="2.5"/>
  <text x="934" y="202" font-family="Iowan Old Style, Palatino, Georgia, serif" font-size="21" fill="#2A2622">Shell and browser</text>
  <text x="934" y="224" font-family="Helvetica Neue, Arial, sans-serif" font-size="15" fill="#7A6E60">its own kernel</text>

  <rect x="912" y="260" width="228" height="66" rx="6" fill="#F1E9DC" stroke="#2A2622" stroke-width="2.5"/>
  <text x="934" y="294" font-family="Iowan Old Style, Palatino, Georgia, serif" font-size="21" fill="#2A2622">Messaging bot</text>
  <text x="934" y="316" font-family="Helvetica Neue, Arial, sans-serif" font-size="15" fill="#7A6E60">its token lives in here</text>

  <rect x="912" y="352" width="228" height="66" rx="6" fill="#F1E9DC" stroke="#2A2622" stroke-width="2.5"/>
  <text x="934" y="386" font-family="Iowan Old Style, Palatino, Georgia, serif" font-size="21" fill="#2A2622">Working memory</text>
  <text x="934" y="408" font-family="Helvetica Neue, Arial, sans-serif" font-size="15" fill="#7A6E60">disposable with the VM</text>

  <rect x="912" y="444" width="228" height="66" rx="6" fill="#F1E9DC" stroke="#2A2622" stroke-width="2.5"/>
  <text x="934" y="478" font-family="Iowan Old Style, Palatino, Georgia, serif" font-size="21" fill="#2A2622">Workspace</text>
  <text x="934" y="500" font-family="Helvetica Neue, Arial, sans-serif" font-size="15" fill="#C0441F">a two way door</text>

  <!-- crossings -->
  <line x1="908" y1="109" x2="622" y2="109" stroke="#2A2622" stroke-width="2.5" marker-end="url(#ar)"/>
  <text x="765" y="92" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="14" fill="#7A6E60">model call, no credential</text>

  <line x1="908" y1="271" x2="622" y2="271" stroke="#C0441F" stroke-width="2.5" marker-end="url(#arr)"/>
  <text x="765" y="254" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="14" fill="#C0441F">outbound, only where allowed</text>

  <line x1="908" y1="363" x2="622" y2="363" stroke="#2A2622" stroke-width="2.5" marker-end="url(#ar)"/>
  <text x="765" y="346" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="14" fill="#7A6E60">may ask, cannot grant</text>

  <line x1="908" y1="455" x2="622" y2="455" stroke="#C8922A" stroke-width="2.5" marker-end="url(#arg)"/>
  <text x="765" y="438" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="14" fill="#7A6E60">memory and files, out to me</text>

  <!-- never crosses -->
  <line x1="60" y1="574" x2="1140" y2="574" stroke="#DDD1BF" stroke-width="2"/>
  <text x="60" y="616" font-family="Iowan Old Style, Palatino, Georgia, serif" font-size="21" fill="#2A2622">Never crosses the wall in either direction</text>

  <g font-family="Helvetica Neue, Arial, sans-serif" font-size="16" fill="#C0441F">
    <rect x="60" y="640" width="180" height="44" rx="22" fill="#F7E7E0" stroke="#C0441F" stroke-width="2"/>
    <text x="150" y="668" text-anchor="middle">my API keys</text>
    <rect x="256" y="640" width="188" height="44" rx="22" fill="#F7E7E0" stroke="#C0441F" stroke-width="2"/>
    <text x="350" y="668" text-anchor="middle">my filesystem</text>
    <rect x="460" y="640" width="188" height="44" rx="22" fill="#F7E7E0" stroke="#C0441F" stroke-width="2"/>
    <text x="554" y="668" text-anchor="middle">my processes</text>
    <rect x="664" y="640" width="216" height="44" rx="22" fill="#F7E7E0" stroke="#C0441F" stroke-width="2"/>
    <text x="772" y="668" text-anchor="middle">my home network</text>
    <rect x="896" y="640" width="120" height="44" rx="22" fill="#F7E7E0" stroke="#C0441F" stroke-width="2"/>
    <text x="956" y="668" text-anchor="middle">the latch</text>
    <rect x="1032" y="640" width="108" height="44" rx="22" fill="#F7E7E0" stroke="#C0441F" stroke-width="2"/>
    <text x="1086" y="668" text-anchor="middle">the cap</text>
  </g>
  <text x="60" y="722" font-family="Helvetica Neue, Arial, sans-serif" font-size="15" fill="#7A6E60">The VM bounds CPU, memory and disk by construction. Money has no physical edge, so it gets an explicit number.</text>
</svg>
