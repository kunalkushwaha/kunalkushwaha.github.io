<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600" role="img" aria-label="The sandbox asks for a destination, the phone approves it, and the kernel closes the door on a timer.">
  <rect width="1200" height="600" fill="#FAF6EF"/>

  <defs>
    <marker id="a3" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#2A2622"/>
    </marker>
  </defs>

  <text x="60" y="52" font-family="Helvetica Neue, Arial, sans-serif" font-size="13" letter-spacing="5" fill="#7A6E60">THE ASK</text>

  <!-- 1 sandbox -->
  <rect x="60" y="86" width="248" height="140" rx="8" fill="#F1E9DC" stroke="#2A2622" stroke-width="3"/>
  <circle cx="92" cy="118" r="15" fill="#2A2622"/>
  <text x="92" y="124" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="15" fill="#FAF6EF">1</text>
  <text x="120" y="124" font-family="Iowan Old Style, Palatino, Georgia, serif" font-size="21" fill="#2A2622">Sandbox asks</text>
  <text x="84" y="162" font-family="Helvetica Neue, Arial, sans-serif" font-size="16" fill="#7A6E60">it names the hosts it wants,</text>
  <text x="84" y="186" font-family="Helvetica Neue, Arial, sans-serif" font-size="16" fill="#7A6E60">and gives a reason</text>
  <text x="84" y="210" font-family="Helvetica Neue, Arial, sans-serif" font-size="15" fill="#C0441F">it cannot open anything</text>

  <line x1="322" y1="156" x2="392" y2="156" stroke="#2A2622" stroke-width="2.5" marker-end="url(#a3)"/>

  <!-- 2 phone -->
  <rect x="406" y="70" width="176" height="290" rx="20" fill="#FDFBF7" stroke="#2A2622" stroke-width="3"/>
  <rect x="466" y="82" width="56" height="8" rx="4" fill="#DDD1BF"/>
  <circle cx="434" cy="118" r="15" fill="#2A2622"/>
  <text x="434" y="124" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="15" fill="#FAF6EF">2</text>
  <text x="462" y="124" font-family="Iowan Old Style, Palatino, Georgia, serif" font-size="20" fill="#2A2622">I decide</text>

  <rect x="426" y="146" width="136" height="96" rx="6" fill="#F1E9DC" stroke="#DDD1BF" stroke-width="2"/>
  <text x="440" y="174" font-family="Helvetica Neue, Arial, sans-serif" font-size="15" fill="#2A2622">github.com:443</text>
  <text x="440" y="198" font-family="Helvetica Neue, Arial, sans-serif" font-size="15" fill="#7A6E60">60 seconds</text>
  <text x="440" y="220" font-family="Helvetica Neue, Arial, sans-serif" font-size="13" fill="#7A6E60">reason: written</text><text x="440" y="236" font-family="Helvetica Neue, Arial, sans-serif" font-size="13" fill="#7A6E60">by the agent</text>

  <rect x="426" y="258" width="80" height="36" rx="18" fill="#C0441F"/>
  <text x="466" y="282" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="15" fill="#FAF6EF">approve</text>
  <rect x="514" y="258" width="48" height="36" rx="18" fill="#F1E9DC" stroke="#7A6E60" stroke-width="2"/>
  <text x="538" y="282" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="14" fill="#7A6E60">deny</text>

  <line x1="596" y1="156" x2="666" y2="156" stroke="#2A2622" stroke-width="2.5" marker-end="url(#a3)"/>

  <!-- 3 kernel opens -->
  <rect x="680" y="86" width="228" height="140" rx="8" fill="#F1E9DC" stroke="#C0441F" stroke-width="3"/>
  <circle cx="712" cy="118" r="15" fill="#2A2622"/>
  <text x="712" y="124" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="15" fill="#FAF6EF">3</text>
  <text x="740" y="124" font-family="Iowan Old Style, Palatino, Georgia, serif" font-size="21" fill="#2A2622">Host opens</text>
  <text x="704" y="162" font-family="Helvetica Neue, Arial, sans-serif" font-size="16" fill="#7A6E60">exactly those addresses,</text>
  <text x="704" y="186" font-family="Helvetica Neue, Arial, sans-serif" font-size="16" fill="#7A6E60">and nothing adjacent</text>

  <line x1="922" y1="156" x2="992" y2="156" stroke="#2A2622" stroke-width="2.5" marker-end="url(#a3)"/>

  <!-- 4 timer -->
  <rect x="1006" y="86" width="134" height="140" rx="8" fill="#F1E9DC" stroke="#2A2622" stroke-width="3"/>
  <circle cx="1038" cy="118" r="15" fill="#2A2622"/>
  <text x="1038" y="124" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="15" fill="#FAF6EF">4</text>
  <text x="1066" y="124" font-family="Iowan Old Style, Palatino, Georgia, serif" font-size="21" fill="#2A2622">Shuts</text>
  <circle cx="1073" cy="176" r="26" fill="none" stroke="#C0441F" stroke-width="4"/>
  <line x1="1073" y1="176" x2="1073" y2="158" stroke="#C0441F" stroke-width="4" stroke-linecap="round"/>
  <line x1="1073" y1="176" x2="1088" y2="184" stroke="#C0441F" stroke-width="4" stroke-linecap="round"/>

  <!-- asymmetry note -->
  <line x1="60" y1="410" x2="1140" y2="410" stroke="#DDD1BF" stroke-width="2"/>
  <text x="60" y="452" font-family="Iowan Old Style, Palatino, Georgia, serif" font-size="23" fill="#2A2622">Why the approvals arrive on a second bot</text>

  <rect x="60" y="476" width="520" height="88" rx="6" fill="#F1E9DC" stroke="#2A2622" stroke-width="2.5"/>
  <text x="84" y="512" font-family="Helvetica Neue, Arial, sans-serif" font-size="17" fill="#2A2622">Bot A: the one the agent drives</text>
  <text x="84" y="540" font-family="Helvetica Neue, Arial, sans-serif" font-size="16" fill="#C0441F">its token lives inside the box</text>

  <rect x="620" y="476" width="520" height="88" rx="6" fill="#F1E9DC" stroke="#C8922A" stroke-width="2.5"/>
  <text x="644" y="512" font-family="Helvetica Neue, Arial, sans-serif" font-size="17" fill="#2A2622">Bot B: the one that grants access</text>
  <text x="644" y="540" font-family="Helvetica Neue, Arial, sans-serif" font-size="16" fill="#7A6E60">its token never enters the box</text>
</svg>
