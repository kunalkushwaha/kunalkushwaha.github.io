<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600" role="img" aria-label="A desk inside a sealed room; the door bolt, the key ring and the logbook are all on the outside.">
  <rect width="1200" height="600" fill="#FAF6EF"/>
  <line x1="40" y1="510" x2="1160" y2="510" stroke="#DDD1BF" stroke-width="2.5"/>

  <!-- room interior -->
  <path d="M72 510 V98 H606 V510" fill="#F1E9DC" stroke="#2A2622" stroke-width="3" stroke-linejoin="round"/>
  <text x="104" y="140" font-family="Helvetica Neue, Arial, sans-serif" font-size="14" letter-spacing="5" fill="#7A6E60">SANDBOX</text>

  <!-- desk -->
  <rect x="132" y="392" width="322" height="15" rx="3" fill="#E4D7C2" stroke="#2A2622" stroke-width="2.5"/>
  <rect x="154" y="407" width="11" height="84" fill="#E4D7C2" stroke="#2A2622" stroke-width="2.5"/>
  <rect x="421" y="407" width="11" height="84" fill="#E4D7C2" stroke="#2A2622" stroke-width="2.5"/>

  <!-- monitor -->
  <rect x="232" y="284" width="166" height="108" rx="7" fill="#FDFBF7" stroke="#2A2622" stroke-width="3"/>
  <rect x="246" y="298" width="138" height="80" rx="3" fill="#2A2622"/>
  <line x1="260" y1="320" x2="326" y2="320" stroke="#C0441F" stroke-width="4" stroke-linecap="round"/>
  <line x1="260" y1="338" x2="356" y2="338" stroke="#C8922A" stroke-width="4" stroke-linecap="round"/>
  <line x1="260" y1="356" x2="308" y2="356" stroke="#7A6E60" stroke-width="4" stroke-linecap="round"/>

  <!-- papers -->
  <rect x="158" y="378" width="54" height="8" rx="2" fill="#FDFBF7" stroke="#2A2622" stroke-width="2"/>
  <rect x="164" y="369" width="54" height="8" rx="2" fill="#FDFBF7" stroke="#2A2622" stroke-width="2"/>

  <!-- stool -->
  <rect x="486" y="404" width="76" height="12" rx="4" fill="#E4D7C2" stroke="#2A2622" stroke-width="2.5"/>
  <rect x="497" y="416" width="9" height="75" fill="#E4D7C2" stroke="#2A2622" stroke-width="2.5"/>
  <rect x="542" y="416" width="9" height="75" fill="#E4D7C2" stroke="#2A2622" stroke-width="2.5"/>

  <!-- the wall, in three segments -->
  <rect x="600" y="98" width="18" height="112" fill="#2A2622"/>
  <rect x="600" y="272" width="18" height="82" fill="#2A2622"/>
  <rect x="600" y="474" width="18" height="36" fill="#2A2622"/>

  <!-- drawer through the wall -->
  <rect x="540" y="210" width="150" height="62" rx="4" fill="#E4D7C2" stroke="#2A2622" stroke-width="3"/>
  <circle cx="668" cy="241" r="6" fill="#2A2622"/>
  <text x="430" y="196" font-family="Helvetica Neue, Arial, sans-serif" font-size="17" fill="#7A6E60">shared folder</text>

  <!-- door leaf in the gap -->
  <rect x="597" y="354" width="24" height="120" fill="#EDE2D0" stroke="#2A2622" stroke-width="3"/>

  <!-- bolt and padlock, on the outside -->
  <rect x="621" y="404" width="80" height="18" rx="9" fill="#C0441F"/>
  <rect x="704" y="396" width="34" height="36" rx="5" fill="#2A2622"/>
  <path d="M712 396 v-12 a9 9 0 0 1 18 0 v12" fill="none" stroke="#2A2622" stroke-width="5"/>
  <text x="621" y="466" font-family="Helvetica Neue, Arial, sans-serif" font-size="17" fill="#C0441F">the latch is on this side</text>

  <!-- my side label -->
  <text x="800" y="142" font-family="Helvetica Neue, Arial, sans-serif" font-size="14" letter-spacing="5" fill="#7A6E60">MY SIDE</text>

  <!-- key ring -->
  <line x1="838" y1="180" x2="838" y2="208" stroke="#2A2622" stroke-width="4" stroke-linecap="round"/>
  <circle cx="838" cy="232" r="24" fill="none" stroke="#C0441F" stroke-width="5"/>
  <path d="M838 256 v52" fill="none" stroke="#C8922A" stroke-width="6" stroke-linecap="round"/>
  <path d="M838 284 h16 M838 302 h13" fill="none" stroke="#C8922A" stroke-width="6" stroke-linecap="round"/>
  <text x="790" y="342" font-family="Helvetica Neue, Arial, sans-serif" font-size="17" fill="#7A6E60">credentials</text>

  <!-- logbook -->
  <rect x="946" y="212" width="190" height="146" rx="5" fill="#FDFBF7" stroke="#2A2622" stroke-width="3"/>
  <line x1="974" y1="250" x2="1108" y2="250" stroke="#C8922A" stroke-width="3"/>
  <line x1="974" y1="276" x2="1108" y2="276" stroke="#DDD1BF" stroke-width="3"/>
  <line x1="974" y1="302" x2="1072" y2="302" stroke="#DDD1BF" stroke-width="3"/>
  <line x1="974" y1="328" x2="1108" y2="328" stroke="#DDD1BF" stroke-width="3"/>
  <text x="946" y="392" font-family="Helvetica Neue, Arial, sans-serif" font-size="17" fill="#7A6E60">audit log</text>
</svg>
